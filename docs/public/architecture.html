<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devproxy local architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #f5f5f5; color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px 0 0; }
    .eyebrow { margin: 0 0 6px; color: #4f5d75; font: 500 10px 'Geist Mono', ui-monospace, monospace; letter-spacing: .14em; }
    h1 { margin: 0 0 4px; font: 28px 'Instrument Serif', Georgia, serif; }
    .subtitle { margin: 0 0 16px; color: #4f5d75; font-size: 13px; line-height: 1.5; }
    .diagram-container { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 800px; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">ARCHITECTURE / LOCAL DEVELOPMENT</p>
    <h1>Where devproxy sits</h1>
    <p class="subtitle">Caddy carries the requests inside devproxy serve. The daemon starts services and keeps routes current.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 800 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="devproxy-architecture-title devproxy-architecture-desc">
        <title id="devproxy-architecture-title">devproxy local architecture</title>
        <desc id="devproxy-architecture-desc">Browser requests travel through embedded Caddy to a development service or the dashboard. The devproxy CLI registers the service with the daemon, which updates Caddy in the same process.</desc>
        <defs>
          <marker id="devproxy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="devproxy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
          <marker id="devproxy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="800" height="472" fill="#f5f5f5"/>
        <g transform="translate(0,-48)">

        <!-- Browser traffic. -->
        <line x1="200" y1="144" x2="320" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#devproxy-arrow-link)"/>
        <line x1="480" y1="144" x2="600" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#devproxy-arrow-link)"/>
        <line x1="436" y1="192" x2="436" y2="284" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#devproxy-arrow-link)"/>

        <!-- Startup and route control. -->
        <line x1="200" y1="332" x2="320" y2="332" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#devproxy-arrow)"/>
        <line x1="364" y1="284" x2="364" y2="192" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#devproxy-arrow-accent)"/>
        <path d="M120 364 V400 Q120 408 128 408 H712 Q720 408 720 400 V176" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#devproxy-arrow)"/>

        <!-- Arrow labels: masks remain clear of the strokes and nodes. -->
        <rect x="236" y="120" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="129" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">HTTPS</text>
        <rect x="514" y="120" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="540" y="129" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">PROXY</text>
        <rect x="448" y="232" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="486" y="241" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">DASHBOARD</text>
        <rect x="228" y="308" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="317" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">REGISTER</text>
        <rect x="284" y="232" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="241" fill="#bf4520" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">GO API</text>
        <rect x="528" y="384" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="393" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".06em">START / CHECK</text>

        <!-- Browser: external input. -->
        <rect x="40" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="112" width="160" height="64" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/>
        <text x="120" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">Browser</text>
        <text x="120" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">*.localhost</text>

        <!-- Embedded Caddy proxy, in the devproxy serve process. -->
        <rect x="320" y="96" width="160" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="96" width="160" height="96" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="328" y="104" width="44" height="12" rx="2" fill="#f5f5f5" stroke="rgba(191,69,32,.45)" stroke-width=".8"/>
        <text x="350" y="113" fill="#bf4520" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".08em">PROXY</text>
        <text x="400" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">Caddy</text>
        <text x="400" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">HTTPS :443</text>
        <text x="400" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">embedded in devproxy</text>

        <!-- Project service. -->
        <rect x="600" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="112" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="680" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">Dev service</text>
        <text x="680" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">127.0.0.1:PORT</text>

        <!-- Project CLI. -->
        <rect x="40" y="300" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="300" width="160" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#5a6580"/>
        <text x="120" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">devproxy CLI</text>
        <text x="120" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">run / register</text>

        <!-- Local daemon. -->
        <rect x="320" y="284" width="160" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="284" width="160" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="328" y="292" width="52" height="12" rx="2" fill="#fff" stroke="rgba(45,49,66,.40)" stroke-width=".8"/>
        <text x="354" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle" letter-spacing=".08em">DAEMON</text>
        <text x="400" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',system-ui,sans-serif" text-anchor="middle">devproxy serve</text>
        <text x="400" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">127.0.0.1:7654</text>
        <text x="400" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace" text-anchor="middle">dashboard + control API</text>

        <!-- Legend strip. -->
        <line x1="40" y1="452" x2="760" y2="452" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace" letter-spacing=".14em">LEGEND</text>
        <line x1="140" y1="476" x2="172" y2="476" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#devproxy-arrow-link)"/>
        <text x="184" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">BROWSER REQUEST</text>
        <line x1="408" y1="476" x2="440" y2="476" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#devproxy-arrow)"/>
        <text x="452" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">STARTUP / ROUTE CONTROL</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
