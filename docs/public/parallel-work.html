<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two projects, four agents, four local URLs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #f5f5f5; color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 960px; margin: 0 auto; padding: 20px 0 0; }
    .eyebrow { margin: 0 0 5px; color: #4f5d75; font: 500 10px 'Geist Mono', ui-monospace, monospace; letter-spacing: .14em; }
    h1 { margin: 0 0 3px; font: 30px 'Instrument Serif', Georgia, serif; }
    .subtitle { margin: 0 0 13px; color: #4f5d75; font-size: 13px; line-height: 1.5; }
    .diagram-container { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    .sans { font-family: 'Geist', system-ui, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .name { fill: #2d3142; font-size: 12px; font-weight: 600; }
    .sublabel { fill: #4f5d75; font-size: 9px; }
    .tag { fill: #5a6580; font-size: 8px; font-weight: 500; letter-spacing: .12em; }
    .url { fill: #2e5aa8; font-size: 9px; }
    @media (max-width: 640px) { .frame { padding-top: 18px; } .frame > :not(.diagram-container) { margin-left: 16px; margin-right: 16px; } .diagram-container::after { content: 'Scroll sideways to see both projects →'; display: block; padding: 10px 16px 12px; color: #4f5d75; font: 11px 'Geist Mono', ui-monospace, monospace; } }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">LOCAL DEVELOPMENT / AN EXAMPLE</p>
    <h1>Two projects. Four agents. Four URLs.</h1>
    <p class="subtitle">Each feature has its own worktree and running app. One local proxy keeps every URL reachable.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-work-title parallel-work-desc">
        <title id="parallel-work-title">Parallel agent work across two projects</title>
        <desc id="parallel-work-desc">Agents A and B work on authentication and checkout in Fernbook. Agents C and D work on search and invoices in Orbitcart. Each worktree has a separate local HTTPS URL; devproxy registers routes in a shared Caddy proxy.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>

        <!-- Project boundaries. -->
        <rect x="40" y="216" width="432" height="300" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="488" y="216" width="432" height="300" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>

        <!-- Browser traffic and route control. -->
        <line x1="240" y1="112" x2="376" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="716" y1="112" x2="584" y2="112" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        <path d="M 428,144 V 176 Q 428,184 420,184 H 264 Q 256,184 256,192 V 240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 532,144 V 192 Q 532,200 540,200 H 696 Q 704,200 704,208 V 240" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="276" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="308" y="101" class="mono tag" text-anchor="middle">HTTPS</text>
        <rect x="622" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="101" class="mono tag" text-anchor="middle">ROUTES</text>

        <!-- Browser. -->
        <rect x="40" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="200" height="64" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/>
        <text x="140" y="108" class="sans name" text-anchor="middle">Browser</text>
        <text x="140" y="126" class="mono sublabel" text-anchor="middle">open a feature URL</text>

        <!-- Caddy: focal traffic entry. -->
        <rect x="376" y="80" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="80" width="208" height="64" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="480" y="108" class="sans name" text-anchor="middle">Caddy</text>
        <text x="480" y="126" class="mono sublabel" text-anchor="middle">HTTPS + reverse proxy</text>

        <!-- devproxy controls Caddy's routes; it is not on the request path. -->
        <rect x="716" y="80" width="204" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="80" width="204" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="818" y="108" class="sans name" text-anchor="middle">devproxy</text>
        <text x="818" y="126" class="mono sublabel" text-anchor="middle">registers live routes</text>

        <!-- Project headings. -->
        <rect x="120" y="240" width="272" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="240" width="272" height="52" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="256" y="263" class="sans name" text-anchor="middle">Fernbook</text>
        <text x="256" y="280" class="mono sublabel" text-anchor="middle">project: fernbook</text>
        <rect x="568" y="240" width="272" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="240" width="272" height="52" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="704" y="263" class="sans name" text-anchor="middle">Orbitcart</text>
        <text x="704" y="280" class="mono sublabel" text-anchor="middle">project: orbitcart</text>

        <!-- Fernbook worktrees. Each card joins one agent, feature, process, and URL. -->
        <rect x="80" y="316" width="352" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="316" width="352" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="96" y="334" class="mono tag">AGENT A · WORKTREE auth-flow</text>
        <text x="96" y="354" class="sans name">Authentication feature</text>
        <text x="96" y="374" class="mono url">https://fernbook-auth-flow.localhost</text>
        <rect x="80" y="416" width="352" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="416" width="352" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="96" y="434" class="mono tag">AGENT B · WORKTREE checkout</text>
        <text x="96" y="454" class="sans name">Checkout feature</text>
        <text x="96" y="474" class="mono url">https://fernbook-checkout.localhost</text>

        <!-- Orbitcart worktrees. -->
        <rect x="528" y="316" width="352" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="316" width="352" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="544" y="334" class="mono tag">AGENT C · WORKTREE search</text>
        <text x="544" y="354" class="sans name">Product search feature</text>
        <text x="544" y="374" class="mono url">https://orbitcart-search.localhost</text>
        <rect x="528" y="416" width="352" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="416" width="352" height="80" rx="6" fill="#fff" stroke="#4f5d75"/>
        <text x="544" y="434" class="mono tag">AGENT D · WORKTREE invoices</text>
        <text x="544" y="454" class="sans name">Invoice feature</text>
        <text x="544" y="474" class="mono url">https://orbitcart-invoices.localhost</text>

        <!-- Legend below the diagram area. -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,.12)"/>
        <text x="40" y="559" class="mono tag">KEY</text>
        <line x1="104" y1="555" x2="136" y2="555" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="148" y="559" class="mono sublabel">browser traffic</text>
        <line x1="300" y1="555" x2="332" y2="555" stroke="#4f5d75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        <text x="344" y="559" class="mono sublabel">route updates</text>
        <text x="648" y="559" class="mono sublabel">Each worktree runs on its own port</text>
      </svg>
    </div>
  </main>
</body>
</html>
