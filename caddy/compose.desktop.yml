name: devproxy-caddy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:2019:2019"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes:
      - ./Caddyfile.desktop:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
